name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches version.txt
        run: |
          VERSION=$(cat version.txt | tr -d '[:space:]')
          EXPECTED_TAG="v${VERSION}.0.0"
          ACTUAL_TAG="${GITHUB_REF_NAME}"
          if [ "$EXPECTED_TAG" != "$ACTUAL_TAG" ]; then
            echo "::error::Tag mismatch: tag is ${ACTUAL_TAG} but version.txt says ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/dimore-*.apk
